<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>記錄 · 回謙錄</title>
<style>

:root{
  --paper:#d7c6a5;--paper-deep:#bda984;--paper-pale:#e8dcc5;
  --ink:#2d281f;--ink-soft:#5b5144;--red:#7b2f27;--gold:#9a7a43;
  --line:rgba(62,48,32,.32);--max:1120px;
}
*{box-sizing:border-box}
html{min-height:100%;background:#cbb995}
body{
  margin:0;min-height:100vh;color:var(--ink);
  background:
    radial-gradient(circle at 14% 12%,rgba(255,255,255,.18),transparent 28%),
    radial-gradient(circle at 78% 20%,rgba(87,62,31,.10),transparent 32%),
    radial-gradient(circle at 46% 75%,rgba(255,255,255,.12),transparent 36%),
    repeating-linear-gradient(0deg,rgba(74,55,32,.025) 0 1px,transparent 1px 5px),
    linear-gradient(135deg,#c9b893,#dfd0b3 45%,#cab893);
  font-family:"ShillaCulture","Batang","AppleMyungjo","Noto Serif KR",serif;
}
button,a{font:inherit;color:inherit}
img{display:block;max-width:100%}
.page-frame{min-height:100vh;position:relative;overflow:hidden}
.page-frame::before,.page-frame::after{
  content:"";position:fixed;pointer-events:none;z-index:20;
  inset:18px;border:1px solid rgba(255,250,235,.45)
}
.page-frame::after{inset:26px;border-color:rgba(73,52,28,.22)}
.corner{position:fixed;width:72px;height:72px;z-index:21;pointer-events:none;opacity:.62}
.corner::before,.corner::after{content:"";position:absolute;background:var(--ink-soft)}
.corner::before{height:1px;width:72px}.corner::after{width:1px;height:72px}
.corner.tl{left:28px;top:28px}.corner.tr{right:28px;top:28px;transform:rotate(90deg)}
.corner.bl{left:28px;bottom:28px;transform:rotate(-90deg)}.corner.br{right:28px;bottom:28px;transform:rotate(180deg)}

.music{position:fixed;right:42px;bottom:38px;z-index:50;display:flex;align-items:center;gap:10px}
.music button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(58,45,28,.42);background:rgba(225,212,184,.9);backdrop-filter:blur(8px);cursor:pointer}
.music .label{font-size:12px;letter-spacing:.16em;color:var(--ink-soft);writing-mode:vertical-rl;background:rgba(225,212,184,.52);padding:8px 5px}

.home{min-height:100vh;display:grid;place-items:center;padding:72px 7vw}
.cover{
  width:min(760px,90vw);min-height:min(760px,74vh);position:relative;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(71,53,31,.45);
  background:linear-gradient(90deg,transparent 0 7%,rgba(68,48,25,.05) 7% 7.3%,transparent 7.3%),
  linear-gradient(180deg,rgba(255,255,255,.11),rgba(88,59,26,.04)),rgba(219,204,170,.34);
  box-shadow:0 28px 60px rgba(55,39,21,.18),inset 0 0 90px rgba(89,61,29,.05)
}
.cover::before,.cover::after{content:"";position:absolute;inset:18px;border:1px solid rgba(71,53,31,.2)}
.cover::after{inset:34px;border-style:dotted;opacity:.55}
.cover-inner{display:flex;align-items:center;gap:34px;position:relative;z-index:2}
.cover-title{writing-mode:vertical-rl;text-orientation:upright;font-size:clamp(58px,9vw,104px);letter-spacing:.12em;line-height:1;font-weight:700}
.cover-copy{writing-mode:vertical-rl;font-size:clamp(15px,1.8vw,20px);line-height:2;letter-spacing:.16em;color:var(--ink-soft);height:280px}
.seal{position:absolute;left:16%;bottom:18%;width:68px;height:68px;border:2px solid var(--red);color:var(--red);display:grid;place-items:center;font-size:18px;line-height:1.2;letter-spacing:.08em;transform:rotate(-4deg);font-weight:700}
.enter{position:absolute;bottom:8%;right:9%;z-index:3;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 3px;letter-spacing:.17em;cursor:pointer}
.enter:hover{color:var(--red);border-color:var(--red)}

.archive-wrap,.detail-wrap{width:min(var(--max),92vw);margin:auto;padding:100px 0 120px}
.archive-head{display:grid;grid-template-columns:auto 1fr;gap:38px;align-items:start;margin-bottom:70px}
.archive-head h1{margin:0;writing-mode:vertical-rl;font-size:56px;letter-spacing:.12em;line-height:1}
.archive-intro{max-width:620px;padding-top:8px}.archive-intro .eyebrow{font-size:13px;letter-spacing:.26em;color:var(--red);margin-bottom:18px}
.archive-intro p{font-size:20px;line-height:1.9;margin:0;color:var(--ink-soft)}
.archive-grid{display:grid;gap:34px}
.record{border-top:1px solid var(--line);padding:30px 0;display:grid;grid-template-columns:88px minmax(0,1.2fr) minmax(270px,.8fr);gap:28px;align-items:center;text-decoration:none;position:relative}
.record::after{content:"";position:absolute;left:88px;right:0;bottom:0;height:1px;background:rgba(70,50,30,.13)}
.record-no{writing-mode:vertical-rl;font-size:22px;letter-spacing:.14em;color:var(--red);justify-self:center}
.record-media{aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(75,54,30,.25);padding:8px;background:rgba(238,225,198,.44)}
.record-media img{width:100%;height:100%;object-fit:cover;filter:saturate(.82) sepia(.10);transition:.45s ease}
.record:hover .record-media img{transform:scale(1.025);filter:saturate(.95)}
.record-meta h2{font-size:30px;margin:0 0 10px;letter-spacing:.05em}.record-meta .period{font-size:13px;letter-spacing:.18em;color:var(--gold);margin-bottom:16px}
.record-meta p{font-size:19px;line-height:1.8;color:var(--ink-soft);margin:0}.record-meta .open{display:inline-block;margin-top:18px;color:var(--red);font-size:13px;letter-spacing:.16em}
.now-record{border:1px solid rgba(85,53,30,.3);padding:44px 40px;margin-top:24px;background:rgba(227,214,184,.22);position:relative;min-height:220px}
.now-record::before{content:"未完";position:absolute;right:42px;top:42px;color:var(--red);border:2px solid var(--red);padding:12px 10px;transform:rotate(-5deg);font-weight:700}
.now-record h2{margin:0 0 14px;font-size:34px}.now-record p{margin:0;max-width:560px;line-height:1.9;color:var(--ink-soft)}

.detail-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.text-btn{text-decoration:none;border-bottom:1px solid var(--line);padding:8px 0;letter-spacing:.12em}
.detail-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:44px;align-items:stretch}
.detail-photo{padding:10px;border:1px solid var(--line);background:rgba(236,224,198,.42)}
.detail-photo img{width:100%;height:100%;min-height:420px;object-fit:cover}
.detail-title{position:relative;padding:22px 0 22px 26px;border-left:1px solid var(--line)}
.detail-title .num{color:var(--red);letter-spacing:.18em;font-size:13px}.detail-title h1{font-size:46px;margin:18px 0 12px;line-height:1.24}
.detail-title .role{font-size:20px;line-height:1.9;color:var(--ink-soft)}.detail-title .stamp{position:absolute;right:4px;bottom:6px;width:64px;height:64px;border:2px solid var(--red);display:grid;place-items:center;color:var(--red);transform:rotate(6deg);font-weight:700}
.detail-body{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:34px}.paper-card{border-top:1px solid var(--line);padding:26px 4px 20px;min-height:160px}
.paper-card h3{font-size:17px;letter-spacing:.16em;color:var(--red);margin:0 0 14px}.paper-card p{font-size:20px;line-height:1.9;margin:0;color:var(--ink-soft)}
.ending{grid-column:1/-1;padding-right:12%;position:relative}.ending::after{content:"";position:absolute;right:2%;top:28px;width:1px;height:88px;background:var(--red);opacity:.48}
.footer{text-align:center;padding:56px 20px 80px;font-size:12px;letter-spacing:.24em;color:rgba(52,44,34,.62)}

.page-turn{position:fixed;inset:0;z-index:100;pointer-events:none;perspective:1600px;visibility:hidden}
.page-turn.on{visibility:visible}
.page-turn .sheet{
  position:absolute;inset:0;background:
  radial-gradient(circle at 18% 15%,rgba(255,255,255,.22),transparent 28%),
  repeating-linear-gradient(0deg,rgba(74,55,32,.035) 0 1px,transparent 1px 5px),
  linear-gradient(90deg,#d3c3a3,#eadfc9 60%,#c4af89);
  transform-origin:left center;box-shadow:18px 0 40px rgba(45,32,18,.28)
}
.page-turn.on .sheet{animation:turnPage .85s cubic-bezier(.55,.05,.25,1) forwards}
@keyframes turnPage{
  0%{transform:rotateY(-96deg);opacity:.55}
  45%{transform:rotateY(-35deg);opacity:1}
  100%{transform:rotateY(0deg);opacity:1}
}
.page-turn.reverse .sheet{transform-origin:right center}
.page-turn.reverse.on .sheet{animation:turnPageReverse .75s cubic-bezier(.55,.05,.25,1) forwards}
@keyframes turnPageReverse{
  0%{transform:rotateY(96deg);opacity:.55}
  100%{transform:rotateY(0deg);opacity:1}
}

@media(max-width:760px){
  .page-frame::before{inset:10px}.page-frame::after{inset:16px}.corner{display:none}
  .music{right:18px;bottom:18px}.music .label{display:none}
  .home{padding:46px 22px}.cover{width:100%;min-height:76vh}.cover-inner{gap:20px}.cover-title{font-size:62px}.cover-copy{font-size:14px;height:250px;line-height:1.8}
  .seal{width:54px;height:54px;font-size:17px;left:12%;bottom:16%}.enter{bottom:7%;right:9%;font-size:14px}
  .archive-wrap,.detail-wrap{width:min(100% - 44px,680px);padding-top:78px}
  .archive-head{grid-template-columns:58px 1fr;gap:20px;margin-bottom:46px}.archive-head h1{font-size:42px}.archive-intro p{font-size:18px}
  .record{grid-template-columns:44px 1fr;gap:16px;padding:24px 0}.record-media,.record-meta{grid-column:2}.record-meta h2{font-size:26px}.record-meta p{font-size:18px}.record::after{left:44px}
  .now-record{padding:32px 26px;min-height:210px}.now-record::before{right:24px;top:28px}
  .detail-hero{grid-template-columns:1fr;gap:20px}.detail-photo img{min-height:0;aspect-ratio:16/10}.detail-title{padding-left:18px}.detail-title h1{font-size:36px;padding-right:60px}
  .detail-body{grid-template-columns:1fr;gap:0}.ending{grid-column:auto;padding-right:0}.ending::after{display:none}
}
@media(max-width:420px){.cover-title{font-size:54px}.cover-copy{font-size:13px;height:238px}.archive-wrap,.detail-wrap{width:calc(100% - 34px)}.record{grid-template-columns:34px 1fr;gap:12px}.record::after{left:34px}}

.record-meta h2,
.detail-title h1{
  word-break:keep-all;
  overflow-wrap:normal;
}
.title-line{display:block;white-space:nowrap}
.diary-card{
  grid-column:1/-1;
  margin-top:26px;
  padding:34px 38px 38px;
  min-height:220px;
  position:relative;
  border:1px solid rgba(77,55,31,.26);
  background:
    linear-gradient(rgba(123,47,39,.055) 1px,transparent 1px) 0 48px/100% 31px,
    rgba(235,222,194,.26);
  box-shadow:inset 0 0 50px rgba(91,65,31,.045);
}
.diary-card::before{
  content:"無謙記";
  position:absolute;right:26px;top:22px;
  writing-mode:vertical-rl;
  color:var(--red);font-size:14px;letter-spacing:.2em;
}
.diary-card .date{
  font-size:13px;letter-spacing:.18em;color:var(--red);margin-bottom:20px
}
.diary-card p{
  margin:0;padding-right:48px;
  font-size:19px;line-height:1.95;color:var(--ink-soft)
}
.slider{
  position:relative;overflow:hidden;
}
.slider-track{
  display:flex;width:100%;height:100%;
  transition:transform .7s cubic-bezier(.22,.61,.36,1)
}
.slide{
  min-width:100%;height:100%;position:relative;overflow:hidden
}
.slide img{
  width:100%;height:100%;object-fit:cover;
}
.slider-controls{
  position:absolute;left:16px;right:16px;bottom:14px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:5;pointer-events:none
}
.slider-arrow{
  pointer-events:auto;cursor:pointer;
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(52,40,25,.35);
  background:rgba(226,213,185,.82);
  display:grid;place-items:center;
  backdrop-filter:blur(6px)
}
.slider-dots{
  display:flex;gap:7px;pointer-events:auto
}
.slider-dot{
  width:8px;height:8px;border-radius:50%;
  border:1px solid rgba(48,37,23,.55);
  background:rgba(237,225,201,.62);padding:0;cursor:pointer
}
.slider-dot.active{background:var(--red);border-color:var(--red)}
@media(max-width:760px){
  .diary-card{padding:28px 24px 32px}
  .diary-card p{padding-right:32px;font-size:17px}
  .slider-arrow{width:34px;height:34px}
}



.screen{display:none;min-height:100vh}
.screen.active{display:block}
.screen.home-screen.active{display:grid}
.home-screen{place-items:center}
.page-turn{visibility:hidden}
.page-turn.on{visibility:visible}


.detail-nav .text-btn{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  border-bottom:1px solid var(--line);
  background:transparent;
  box-shadow:none;
  border-radius:0;
  color:var(--ink);
  padding:8px 0 7px;
  margin:0;
  min-width:0;
  cursor:pointer;
  font-family:inherit;
  font-size:18px;
  line-height:1.2;
  letter-spacing:.12em;
}
.detail-nav .text-btn:hover{
  color:var(--red);
  border-bottom-color:var(--red);
}
.detail-nav .text-btn:focus-visible{
  outline:1px solid var(--red);
  outline-offset:5px;
}


.detail-photo.slider{
  padding:0;
  overflow:hidden;
  background:transparent;
}
.detail-photo.slider .slider-track,
.detail-photo.slider .slide{
  height:100%;
  min-height:420px;
}
.detail-photo.slider .slide img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center center;
}
@media(max-width:760px){
  .detail-photo.slider .slider-track,
  .detail-photo.slider .slide{
    min-height:0;
    aspect-ratio:16/10;
  }
  .detail-photo.slider .slide img{
    aspect-ratio:16/10;
  }
}


.detail-title h1{
  transition:opacity .24s ease, transform .24s ease;
}
.detail-title h1.title-changing{
  opacity:.18;
  transform:translateY(4px);
}

const params=new URLSearchParams(location.search);
let currentRecord=Math.max(0,Math.min(records.length-1,(parseInt(params.get("record")||"1",10)-1)));

function splitTitleLines(title){

    "능소화 아래의 약속":["능소화 아래의","약속"],

    "약향에 밴 사람":["약향에 밴","사람"],

    "당신과 했던 다방데이트":["당신과 했던","다방데이트"],
    "시끌벅적했던 시장거리":["시끌벅적했던","시장거리"],
    "둘이어서 충분했던 저녁":["둘이어서 충분했던","저녁"],

  document.getElementById("detailContent").innerHTML=`
    <section class="detail-hero">
      <div class="detail-photo slider" id="recordSlider">
        <div class="slider-track" id="sliderTrack"></div>
        <div class="slider-controls" id="sliderControls">
          <button type="button" class="slider-arrow" id="prevSlide">‹</button>
          <div class="slider-dots" id="sliderDots"></div>
          <button type="button" class="slider-arrow" id="nextSlide">›</button>
        </div>
      </div>
      <div class="detail-title">
        <div class="num">${r.no} · ${r.period}</div>
        <h1 id="slideTitle"></h1>
        <div class="role">${r.role}</div>
        <div class="stamp">${String(currentRecord+1).padStart(2,"0")}</div>
      </div>
    </section>
    <section class="detail-body">
      <article class="paper-card"><h3>記憶 · 남은 기억</h3><p>${r.memory}</p></article>
      <article class="paper-card"><h3>緣 · 두 사람</h3><p>${r.role}</p></article>
      <article class="paper-card ending"><h3>終 · 그 생의 끝</h3><p>${r.ending}</p></article>
      <article class="diary-card"><div class="date">${r.no} · 無謙記</div><p>${r.diary.replace(/\n/g,"<br>")}</p></article>
    </section>`;
  renderSlider();
}

function updateSlideTitle(){
  const r=records[currentRecord];
  const src=validSlides[sliderIndex];
  const title=(r.slideTitles||{})[src] || r.title;
  const el=document.getElementById("slideTitle");
  const lines=splitTitleLines(title);
  el.innerHTML=lines.map(line=>`<span class="title-line">${line}</span>`).join("");
}

function renderSlider(){
  const track=document.getElementById("sliderTrack");
  const dots=document.getElementById("sliderDots");
  const controls=document.getElementById("sliderControls");
  track.innerHTML=validSlides.map(src=>`<div class="slide"><img src="${src}" alt=""></div>`).join("");
  dots.innerHTML=validSlides.map((_,i)=>`<button type="button" class="slider-dot ${i===0?"active":""}" data-slide="${i}"></button>`).join("");
  controls.hidden=validSlides.length<=1;
  sliderIndex=0;
  moveSlider(0,false);
  document.getElementById("prevSlide").addEventListener("click",()=>moveSlider(sliderIndex-1));
  document.getElementById("nextSlide").addEventListener("click",()=>moveSlider(sliderIndex+1));
  dots.addEventListener("click",e=>{
    const b=e.target.closest("[data-slide]");
    if(b) moveSlider(Number(b.dataset.slide));
  });
}
function moveSlider(i,restart=true){
  sliderIndex=(i+validSlides.length)%validSlides.length;
  document.getElementById("sliderTrack").style.transform=`translateX(-${sliderIndex*100}%)`;
  document.querySelectorAll(".slider-dot").forEach((d,n)=>d.classList.toggle("active",n===sliderIndex));
  updateSlideTitle();
  if(restart) startSlider();
}
function startSlider(){
  clearInterval(sliderTimer);
  if(validSlides.length>1) sliderTimer=setInterval(()=>moveSlider(sliderIndex+1,false),3000);
}

renderDetail();
startSlider();

document.getElementById("backLink").addEventListener("click",()=>pageTurnTo("archive.html",true,false));
document.getElementById("nextLink").addEventListener("click",()=>{
  const next=(currentRecord+1)%records.length+1;
  pageTurnTo(`detail.html?record=${next}`,false,false);
});
</script>
