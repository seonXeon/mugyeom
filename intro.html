<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>回謙錄 · 회겸록</title>
<style>
:root{
  --ink:#293036;
  --muted:#6f777c;
  --orange:#d86b36;
  --line:rgba(48,58,64,.18);
  --paper:#f8fbfb;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow:hidden}
body{
  font-family:"Batang","AppleMyungjo","Noto Serif KR",serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 50% 42%,rgba(255,255,255,.96) 0 20%,rgba(249,252,252,.86) 42%,rgba(231,241,244,.76) 100%),
    linear-gradient(135deg,#edf4f6,#fbfcfb 52%,#eaf1f4);
}
button{font:inherit;color:inherit}
.intro{
  position:relative;
  width:100%;
  height:100vh;
  min-height:640px;
  overflow:hidden;
  display:grid;
  place-items:center;
  isolation:isolate;
}
.intro::before{
  content:"";
  position:absolute;inset:0;z-index:-5;
  background:
    linear-gradient(118deg,transparent 0 24%,rgba(238,148,82,.13) 24.3% 24.7%,transparent 25%),
    radial-gradient(ellipse at 52% 45%,rgba(255,255,255,.98) 0 19%,rgba(255,255,255,.46) 44%,transparent 70%);
}
.shadow{
  position:absolute;inset:0;z-index:-4;pointer-events:none;
  opacity:.2;
  background:
    radial-gradient(ellipse at 15% 16%,rgba(45,70,54,.34),transparent 28%),
    radial-gradient(ellipse at 86% 72%,rgba(49,73,55,.22),transparent 26%);
  filter:blur(18px);
  animation:shadowMove 9s ease-in-out infinite alternate;
}
.flower{
  position:absolute;top:-3%;bottom:-3%;width:42%;z-index:-2;
  background-repeat:no-repeat;
  background-size:cover;
  filter:saturate(.98) contrast(1.02);
  will-change:transform;
}

  -webkit-mask-image:linear-gradient(270deg,#000 0 70%,transparent 100%);
  mask-image:linear-gradient(270deg,#000 0 70%,transparent 100%);
}
.glow{
  position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(102deg,transparent 25%,rgba(255,255,255,.7) 45%,rgba(255,255,255,.3) 58%,transparent 72%),
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.78),transparent 42%);
}
.content{
  position:relative;
  z-index:5;
  width:min(720px,72vw);
  text-align:center;
  padding:48px 28px 58px;
}
.eyebrow{
  margin-bottom:20px;
  font-size:15px;
  letter-spacing:.42em;
  color:#535c61;
}
.title{
  margin:0;
  font-size:clamp(84px,11vw,168px);
  line-height:.94;
  letter-spacing:.02em;
  font-weight:600;
  text-shadow:0 8px 30px rgba(71,55,42,.08);
}
.title span{
  background:linear-gradient(100deg,#222d32 22%,#cc6d41 62%,#563e32 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.flourish{
  width:min(430px,72%);
  height:1px;
  margin:20px auto 18px;
  background:linear-gradient(90deg,transparent,var(--orange),transparent);
  position:relative;
}
.flourish::after{
  content:"";
  position:absolute;left:50%;top:50%;
  width:8px;height:8px;border:1px solid var(--orange);
  transform:translate(-50%,-50%) rotate(45deg);
  background:rgba(255,255,255,.74);
}
.roman{
  font-family:Georgia,"Times New Roman",serif;
  font-size:14px;
  letter-spacing:.55em;
  color:#555d61;
  margin-left:.55em;
}
.copy{
  margin:34px auto 0;
  font-size:20px;
  line-height:1.72;
  letter-spacing:.03em;
  color:#4f595e;
  word-break:keep-all;
}
.copy strong{font-weight:600;color:#2e373c}
.enter{
  margin-top:42px;
  border:1px solid rgba(63,73,79,.28);
  border-radius:999px;
  background:rgba(255,255,255,.64);
  backdrop-filter:blur(10px);
  padding:14px 27px 13px;
  font-size:16px;
  letter-spacing:.15em;
  cursor:pointer;
  transition:transform .25s ease,background .25s ease,border-color .25s ease;
  box-shadow:0 9px 30px rgba(65,76,81,.07);
}
.enter:hover{transform:translateY(-2px);background:rgba(255,255,255,.9);border-color:rgba(216,107,54,.5)}
.enter::after{content:"  →";color:var(--orange)}

.petals{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.petal{
  position:absolute;top:-10%;
  width:13px;height:8px;
  border-radius:80% 18% 80% 18%;
  background:linear-gradient(135deg,#ef8a4e,#d85f2b);
  opacity:.58;
  filter:blur(.15px);
  animation:fall linear infinite;
}
.petal:nth-child(1){left:11%;animation-duration:9s;animation-delay:-3s}
.petal:nth-child(2){left:24%;animation-duration:12s;animation-delay:-7s;transform:scale(.75)}
.petal:nth-child(3){left:67%;animation-duration:10s;animation-delay:-1s;transform:scale(.9)}
.petal:nth-child(4){left:82%;animation-duration:13s;animation-delay:-9s;transform:scale(.7)}
.petal:nth-child(5){left:92%;animation-duration:8.5s;animation-delay:-5s;transform:scale(1.1)}

.page-turn{position:fixed;inset:0;z-index:99;pointer-events:none;visibility:hidden}
.page-turn.on{visibility:visible}
.page-turn .sheet{
  position:absolute;inset:0;background:#f4f3eb;
  transform-origin:right center;transform:perspective(1400px) rotateY(90deg);
}
.page-turn.on .sheet{animation:turn .68s cubic-bezier(.65,.05,.36,1) forwards}
@keyframes turn{0%{transform:perspective(1400px) rotateY(90deg)}100%{transform:perspective(1400px) rotateY(0)}}
@keyframes swayLeft{from{transform:rotate(-.5deg) scale(1.015)}to{transform:rotate(.8deg) translateX(.7%) scale(1.03)}}
@keyframes swayRight{from{transform:rotate(.45deg) scale(1.015)}to{transform:rotate(-.8deg) translateX(-.7%) scale(1.03)}}
@keyframes shadowMove{from{transform:translate3d(-1%,0,0)}to{transform:translate3d(1.5%,1%,0)}}
@keyframes fall{
  0%{transform:translate3d(0,-8vh,0) rotate(0);opacity:0}
  10%{opacity:.62}
  100%{transform:translate3d(80px,116vh,0) rotate(420deg);opacity:0}
}

@media(max-width:700px){
  .intro{min-height:560px}
  .flower{width:58%;top:-1%;bottom:-1%;opacity:.88}
  .flower.left{left:-22%;background-position:18% center}
  .flower.right{right:-22%;background-position:82% center}
  .content{width:100%;padding:38px 24px 46px}
  .eyebrow{font-size:14px;letter-spacing:.32em;margin-bottom:18px}
  .title{font-size:clamp(72px,22vw,112px)}
  .flourish{width:62%;margin-top:18px}
  .roman{font-size:12px;letter-spacing:.38em;margin-left:.38em}
  .copy{margin-top:28px;font-size:18px;line-height:1.62}
  .enter{margin-top:34px;font-size:15px;padding:13px 23px 12px}
  .glow{background:
    radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.96) 0 26%,rgba(255,255,255,.75) 42%,rgba(255,255,255,.28) 68%,transparent 82%);
  }
}
@media(max-width:390px){
  .content{padding-left:20px;padding-right:20px}
  .copy{font-size:17px}
  .title{font-size:76px}
}
@media(prefers-reduced-motion:reduce){
  .flower,.shadow,.petal{animation:none}
}
</style>
</head>
<body>
<main class="intro">
  <div class="shadow"></div>
  <div class="flower left" aria-hidden="true"></div>
  <div class="flower right" aria-hidden="true"></div>
  <div class="glow"></div>
  <div class="petals" aria-hidden="true">
    <i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i>
  </div>

<script>
function pageTurnTo(url,start=false){
  if(start) window.parent.postMessage({type:"hg-start-music"},"*");
  const fx=document.getElementById("pageTurn");
  fx.classList.add("on");
  setTimeout(()=>window.parent.postMessage({type:"hg-navigate",url},"*"),650);
}
document.getElementById("enterBtn").addEventListener("click",()=>pageTurnTo("archive.html",true));
</script>
